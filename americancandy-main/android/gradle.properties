org.gradle.jvmargs=-Xmx2g -Xss512k -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:HeapBaseMinAddress=8g -XX:+UseG1GC -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.workers.max=1
kotlin.daemon.jvm.options=-Xmx512m
android.useAndroidX=true
android.enableJetifier=true
org.gradle.daemon=false
org.gradle.vfs.watch=false
# Workaround Kotlin incremental cache crash during plugin compilation (stripe_android)
kotlin.incremental=false
kotlin.incremental.useClasspathSnapshot=false
kotlin.compiler.execution.strategy=in-process
